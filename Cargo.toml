[workspace]
resolver = "3"
members = [
    "crates/zkopa-axum",
    "crates/zkopa-cli",
    "crates/zkopa-ir",
    "crates/zkopa-kernel",
    "crates/zkopa-policy",
    "crates/zkopa-prove",
]
default-members = ["crates/zkopa-cli"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
anyhow = "1.0.104"
arc-swap = "1.7"
ark-bn254 = { version = "0.6", default-features = false, features = ["std", "curve"] }
ark-crypto-primitives = { version = "0.6", default-features = false, features = ["std"] }
ark-ec = { version = "0.6", default-features = false, features = ["std"] }
ark-ed-on-bn254 = { version = "0.6", default-features = false, features = ["std"] }
ark-ff = { version = "0.6", default-features = false, features = ["std"] }
ark-groth16 = { version = "0.6", default-features = false, features = ["std"] }
ark-r1cs-std = { version = "0.6", default-features = false, features = ["std"] }
ark-relations = { version = "0.6", default-features = false, features = ["std"] }
ark-serialize = { version = "0.6", default-features = false, features = ["std"] }
ark-std = { version = "0.6", default-features = false, features = ["std"] }
axum = { version = "0.8.9", default-features = false }
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
ed25519-dalek = { version = "3", default-features = false }
rand = { version = "0.8.8", default-features = false, features = ["std", "getrandom"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = { version = "0.11", default-features = false }
tempfile = "3"
thiserror = "2"
tokio = { version = "1.54.1", default-features = false }
tower = { version = "0.5.3", default-features = false }
zkopa-ir = { path = "crates/zkopa-ir" }
zkopa-kernel = { path = "crates/zkopa-kernel" }
zkopa-policy = { path = "crates/zkopa-policy" }
zkopa-prove = { path = "crates/zkopa-prove" }

# arkworks is far too slow unoptimized, and its generic code is compiled inside our crates too.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
redundant_clone = "deny"
